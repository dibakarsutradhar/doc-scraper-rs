[package]
name = "doc-scraper-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "The fastest, cleanest way to export GitBook docs as markdown."
license = "MIT"
repository = "https://github.com/your-handle/doc-scraper-rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1.47", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
regex = "1.10"
url = "2.5"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
futures = "0.3"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "doc-scraper"
path = "src/main.rs"